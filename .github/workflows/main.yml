name: Run Provisioning API

# Skriptet körs automatiskt vid varje "push" till main-branchen, eller manuellt
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-provision:
    runs-on: windows-latest

    steps:
    # 1. Hämtar koden och users.json från ditt GitHub-arkiv
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Kör PowerShell-skriptet direkt i GitHub Actions
    - name: Run Provisioning Script
      shell: powershell
      run: |
        $API_KEY = "st-veronica-ramirez-levik-b4d5d9"
        $URL = "https://systementor.se"
        $FILE = "users.json"

        # Kontrollera att filen faktiskt finns
        if (-not (Test-Path $FILE)) {
            Write-Error "Hittade inte filen $FILE i arkivet!"
            exit 1
        }

        # Läs in JSON-filen
        $jsonContent = Get-Content -Path $FILE -Raw
        $users = $jsonContent | ConvertFrom-Json

        # VG-krav: Behåll endast aktiva användare
        $activeUsers = $users | Where-Object { $_.IsActive -eq $true }

        Write-Host "Hittade $($activeUsers.Count) aktiva användare att provisionera."

        # Mappa om till den struktur API:et förväntar sig (liten startbokstav i fälten)
        $payloadList = foreach ($u in $activeUsers) {
            [PSCustomObject]@{
                name       = "$($u.FirstName) $($u.LastName)"
                department = $u.Department
                isActive   = $u.IsActive
                email      = "$($u.FirstName.ToLower()).$($u.LastName.ToLower())@tssab.com"
            }
        }

        # Omvandla listan till JSON
        $body = $payloadList | ConvertTo-Json -Depth 5

        # Förbered headers (inkluderar VG-kravet X-Integration-Level och auktorisering)
        $headers = @{
            "Authorization"      = "Bearer $API_KEY"
            "X-Integration-Level" = "Advanced"
            "Content-Type"       = "application/json"
        }

        # Skicka anropet
        try {
            $response = Invoke-RestMethod -Uri $URL -Method Post -Headers $headers -Body $body
            $response
        }
        catch {
            Write-Error "Ett fel uppstod vid anropet: $_"
            exit 1
        }
